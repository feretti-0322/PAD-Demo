<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内フロー事例集 | Fellows PAD道場</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/corporate.css?v=13">
  <script src="js/theme.js?v=3"></script>
  <style>
    .learn-hero {
      background: linear-gradient(135deg, #1a3a5c 0%, #0d7377 100%);
      border-radius: 12px; padding: 36px; color: #fff; margin-bottom: 24px;
    }
    .learn-hero h2 { font-size: 24px; font-weight: 700; margin: 0 0 12px; }
    .learn-hero p { font-size: 15px; line-height: 1.9; margin: 0; opacity: 0.95; }

    .point-block { background: #f4f6f9; border-left: 4px solid #2c7be5; border-radius: 0 8px 8px 0; padding: 14px 18px; font-size: 14px; line-height: 1.9; color: #333; margin-top: 16px; }
    .point-block strong { color: #1a3a5c; }
    .summary-card { background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%); border-left: 4px solid #00b274; border-radius: 8px; padding: 18px 22px; margin-top: 20px; }
    .summary-card h4 { color: #065f46; margin: 0 0 10px; font-size: 15px; }
    .summary-card ol { margin: 0; padding-left: 22px; font-size: 14px; line-height: 2; color: #333; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .form-row label { font-weight: 700; color: #1a3a5c; }
    .form-row input[type=text], .form-row input[type=number], .form-row select, .form-row textarea {
      padding: 8px 10px; border: 2px solid #e0e6ed; border-radius: 6px; font-size: 13px; font-family: inherit; box-sizing: border-box; width: 100%;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: #2c7be5; }
    .form-row.full { grid-column: 1 / -1; }
    .err-msg { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    .ok-msg { color: #065f46; font-size: 13px; margin-top: 8px; }

    /* アクション選択チェックボックス（投稿フォーム＆フィルター共通） */
    .action-checks { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
    .action-checks label {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border: 2px solid #e0e6ed; border-radius: 18px;
      font-size: 14px; font-weight: 500; color: #333; cursor: pointer;
      background: #fff; transition: all 0.15s;
    }
    .action-checks label:hover { border-color: #2c7be5; }
    .action-checks label.checked { background: #e0ecff; border-color: #2c7be5; color: #1a3a5c; font-weight: 700; }
    .action-checks input[type=checkbox] { margin: 0; }

    /* PADフローテキスト入力 */
    .flow-section { margin-top: 14px; padding: 14px; background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 8px; }
    .flow-section h4 { margin: 0 0 6px; font-size: 14px; color: #1a3a5c; }
    .flow-section .hint { font-size: 14px; color: #6b7280; margin-bottom: 10px; line-height: 1.7; }
    .flow-pair { background: #fff; border: 1px solid #e0e6ed; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
    .flow-pair .pair-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .flow-pair .pair-head input { flex: 1; padding: 6px 10px; border: 2px solid #e0e6ed; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .flow-pair .pair-head input:focus { outline: none; border-color: #2c7be5; }
    .flow-pair textarea { width: 100%; min-height: 90px; padding: 8px 10px; border: 2px solid #e0e6ed; border-radius: 6px; font-size: 14px; font-family: 'Consolas', 'Courier New', monospace; box-sizing: border-box; resize: vertical; }
    .flow-pair textarea:focus { outline: none; border-color: #2c7be5; }
    .flow-pair .pair-del { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 14px; }
    .flow-pair .pair-del:hover { background: #fee2e2; }
    .btn-add-flow { background: #f0f9ff; border: 1px dashed #2c7be5; color: #1d4ed8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-add-flow:hover { background: #dbeafe; }

    /* 添付ファイル */
    .attach-input { display: block; margin-bottom: 8px; font-size: 13px; }
    .attach-item { background: #fff; border: 1px solid #e0e6ed; border-radius: 6px; padding: 6px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .attach-item .att-name { flex: 1; color: #1a3a5c; word-break: break-all; }
    .attach-item .att-size { color: #6b7280; font-size: 14px; }
    .attach-item .att-del { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 14px; }
    .attach-item .att-del:hover { background: #fee2e2; }
    .case-card .attaches { font-size: 14px; color: #6b7280; line-height: 1.6; word-break: break-all; }

    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .filter-grid > div { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #6b7280; }
    .filter-grid input, .filter-grid select { padding: 8px 10px; border: 2px solid #e0e6ed; border-radius: 6px; font-size: 13px; box-sizing: border-box; width: 100%; }
    .filter-actions-row { margin-top: 12px; }
    .filter-actions-row > label { font-size: 14px; color: #6b7280; display: block; margin-bottom: 4px; }

    .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 14px; }
    .case-card { background: #fff; border: 1px solid #e0e6ed; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .case-card .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .case-card .cat { background: #f4f6f9; color: #1a3a5c; }
    .case-card .badges span { padding: 3px 10px; border-radius: 12px; font-size: 14px; font-weight: 700; }
    .case-card h4 { margin: 0; font-size: 15px; color: #1a3a5c; line-height: 1.5; }
    .case-card .summary { font-size: 13px; color: #555; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
    .case-card .actions { font-size: 14px; color: #6b7280; line-height: 1.5; }
    .case-card .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid #f0f0f0; font-size: 14px; color: #555; flex-wrap: wrap; }
    .case-card .footer-left { display: flex; gap: 8px; align-items: center; }
    .case-card .like-btn { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 14px; }
    .case-card .like-btn:hover { background: #fee2e2; }
    .case-card .like-btn.liked { background: #fecaca; font-weight: 700; }
    .case-card .download-btn { background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 14px; }
    .case-card .download-btn:hover { background: #d1fae5; }
    .case-card .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .case-card .author { font-size: 14px; color: #6b7280; }
    .case-card .saved { font-weight: 700; color: #065f46; }
    .case-card .delete-btn { position: absolute; top: 10px; right: 10px; background: #fff; border: 1px solid #fecaca; color: #b91c1c; padding: 2px 8px; border-radius: 12px; cursor: pointer; font-size: 14px; }
    .case-card .delete-btn:hover { background: #fee2e2; }
    .empty-msg { text-align: center; color: #9ca3af; padding: 30px; font-size: 14px; }
    .loading-msg { text-align: center; color: #6b7280; padding: 20px; font-size: 13px; }

    /* ===== 埋め込みモード（ホーム画面のタブに iframe で表示するとき）=====
       自前のサイドバー・トップバー・フッター・ヒーローを隠し、
       コンテンツだけをタブ内にフラットに表示する */
    html.embed body { background: transparent; }
    html.embed #sidebarContainer { display: none; }
    html.embed .topbar { display: none; }
    html.embed .app-footer { display: none; }
    html.embed .learn-hero { display: none; }
    html.embed .main-content { margin-left: 0; }
    html.embed .page-content { padding: 0; max-width: none; }
    html.embed .card:first-of-type { margin-top: 0; }
  </style>
  <script>
    // iframe 埋め込み（?embed=1）のときは body 描画前に embed クラスを付与
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.documentElement.classList.add('embed');
    }
  </script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title">📚 社内フロー事例集</div>
        <div class="topbar-user"><span>👤</span><span id="topbarUser">...</span></div>
      </header>
      <main class="page-content">

        <section class="learn-hero">
          <h2>📚 社内フロー事例集 ― 同僚の自動化を真似て学ぼう</h2>
          <p>自分の業務にPADを応用するとき、ゼロから設計するより<strong>「他の人がどう自動化したか」を真似るほうが圧倒的に早い</strong>。このページは全国200名の受講者が投稿したフロー事例を<strong>探して・見る</strong>ための共有スペースです。気に入った事例には「いいね」を押し、フローテキストをZIPでダウンロードしてPADに取り込みましょう。<br><strong>✏️ 事例の投稿は<a href="pad-overview.html#post" style="color:#fff; text-decoration:underline;">ホーム画面</a>から行えます。</strong></p>
        </section>

        <div class="card">
          <div class="card-header"><h3>🔍 事例を探す</h3></div>
          <div class="card-body">
            <div class="filter-grid">
              <div>
                <label>キーワード検索</label>
                <input type="text" id="fSearch" placeholder="タイトル・概要で絞り込み">
              </div>
              <div>
                <label>カテゴリ</label>
                <select id="fFilterCat">
                  <option value="">すべて</option>
                  <option>スタッフ管理</option>
                  <option>求人媒体運用</option>
                  <option>売上集計</option>
                  <option>Excel自動化</option>
                  <option>メール処理</option>
                  <option>その他</option>
                </select>
              </div>
              <div>
                <label>ソート</label>
                <select id="fSort">
                  <option value="new">新着順</option>
                  <option value="like">いいね順</option>
                  <option value="saved">節約時間順</option>
                </select>
              </div>
            </div>
            <div class="filter-actions-row">
              <label>使用アクションで絞り込み（複数選択可・OR条件・すべて未チェックなら絞り込みなし）</label>
              <div class="action-checks" id="fFilterActions">
                <label><input type="checkbox" value="ブラウザ操作"><span>ブラウザ操作</span></label>
                <label><input type="checkbox" value="Excel操作"><span>Excel操作</span></label>
                <label><input type="checkbox" value="Outlook操作"><span>Outlook操作</span></label>
                <label><input type="checkbox" value="その他"><span>その他</span></label>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>💡 投稿された事例（<span id="caseCount">0</span>件）</h3></div>
          <div class="card-body">
            <div id="caseList"><div class="loading-msg">読み込み中...</div></div>
          </div>
        </div>

      </main>
      <footer class="app-footer">© 2025 Fellows PAD道場</footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/env.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js?v=8"></script>
  <script>
    let currentUser = null;
    let isAdminFlag = false;
    let cases = [];
    let likeMap = {};       // { case_study_id: count }
    let likedSet = new Set();
    let flowFileSet = new Set(); // フローファイルが1件以上ある case_study_id
    let attachmentMap = {};      // { case_study_id: [{file_name, storage_path}, ...] }
    let profileMap = {};         // { user_id: display_name }
    const PAGE_SIZE = 15;        // 初期表示＆「もっと見る」1回あたりの表示追加数
    let visibleCount = PAGE_SIZE;

    const FILE_NAME_FORBIDDEN = /[\\/:*?"<>|]/g;

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatRelativeTime(ts) {
      const diff = Date.now() - new Date(ts).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'たった今';
      if (m < 60) return m + '分前';
      const h = Math.floor(m / 60);
      if (h < 24) return h + '時間前';
      const d = Math.floor(h / 24);
      if (d === 1) return '昨日';
      if (d < 7) return d + '日前';
      const dt = new Date(ts);
      return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
    }

    function sanitizeFileName(s) {
      return String(s || '').replace(FILE_NAME_FORBIDDEN, '_').trim();
    }

    function todayYmd() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }

    // チェックボックスラベルの選択時ハイライト
    function bindActionCheckHighlight(container) {
      container.querySelectorAll('input[type=checkbox]').forEach(cb => {
        const apply = () => cb.parentElement.classList.toggle('checked', cb.checked);
        cb.addEventListener('change', apply);
        apply();
      });
    }

    function getCheckedActions(containerId) {
      return Array.from(document.querySelectorAll('#' + containerId + ' input[type=checkbox]:checked')).map(c => c.value);
    }

    // -------- データ取得 --------
    async function loadAll() {
      const { data: caseData, error: caseErr } = await window.supabaseClient
        .from('case_studies')
        .select('id, user_id, title, category, saved_hours, summary, actions, created_at')
        .order('created_at', { ascending: false });
      if (caseErr) {
        document.getElementById('caseList').innerHTML = '<div class="empty-msg">事例の取得に失敗しました：' + escapeHtml(caseErr.message) + '</div>';
        return;
      }
      cases = caseData || [];

      // profiles を別クエリで取得して user_id → display_name のマップに追記（既存はクリアしない）
      const userIds = [...new Set(cases.map(c => c.user_id))];
      if (userIds.length > 0) {
        const { data: profs, error: profErr } = await window.supabaseClient
          .from('profiles')
          .select('id, display_name')
          .in('id', userIds);
        if (profErr) console.warn('profiles取得失敗', profErr);
        (profs || []).forEach(p => { profileMap[p.id] = p.display_name; });
      }

      // フロー有無の集計（ボタン表示判定用）。flow_text 本体は取らない。
      const { data: flowCounts, error: flowErr } = await window.supabaseClient
        .from('case_flow_files')
        .select('case_study_id');
      if (flowErr) console.warn('フロー集計失敗', flowErr);
      flowFileSet = new Set((flowCounts || []).map(r => r.case_study_id));

      // 添付ファイルメタ情報を取得（実体は取らない）
      const { data: attachData, error: attachErr } = await window.supabaseClient
        .from('case_attachments')
        .select('case_study_id, file_name, storage_path');
      if (attachErr) console.warn('添付メタ取得失敗', attachErr);
      attachmentMap = {};
      (attachData || []).forEach(a => {
        if (!attachmentMap[a.case_study_id]) attachmentMap[a.case_study_id] = [];
        attachmentMap[a.case_study_id].push({ file_name: a.file_name, storage_path: a.storage_path });
      });

      const { data: likeData, error: likeErr } = await window.supabaseClient
        .from('case_likes')
        .select('case_study_id, user_id');
      if (likeErr) console.warn('いいね取得失敗', likeErr);

      likeMap = {};
      likedSet = new Set();
      (likeData || []).forEach(l => {
        likeMap[l.case_study_id] = (likeMap[l.case_study_id] || 0) + 1;
        if (l.user_id === currentUser.id) likedSet.add(l.case_study_id);
      });

      render();
    }

    // -------- 一覧描画 --------
    function render() {
      const kw = document.getElementById('fSearch').value.trim().toLowerCase();
      const cat = document.getElementById('fFilterCat').value;
      const sort = document.getElementById('fSort').value;
      const filterActs = getCheckedActions('fFilterActions');

      let filtered = cases.filter(c => {
        if (cat && c.category !== cat) return false;
        if (filterActs.length > 0) {
          const cActs = (c.actions || '').split(',').map(s => s.trim()).filter(Boolean);
          if (!filterActs.some(a => cActs.includes(a))) return false;
        }
        if (kw && !(c.title.toLowerCase().includes(kw) || (c.summary || '').toLowerCase().includes(kw))) return false;
        return true;
      });

      filtered.sort((a, b) => {
        if (sort === 'like') return (likeMap[b.id] || 0) - (likeMap[a.id] || 0);
        if (sort === 'saved') return b.saved_hours - a.saved_hours;
        return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
      });

      document.getElementById('caseCount').textContent = filtered.length;

      const list = document.getElementById('caseList');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-msg">該当する事例が見つかりません。最初の投稿者になるか、フィルタ条件を変えてみてください。</div>';
        return;
      }

      const shown = filtered.slice(0, visibleCount);
      list.innerHTML = '<div class="case-grid">' + shown.map(c => {
        const author = profileMap[c.user_id] || '不明なユーザー';
        const likeCount = likeMap[c.id] || 0;
        const liked = likedSet.has(c.id);
        const canDelete = isAdminFlag || c.user_id === currentUser.id;
        const hasFlow = flowFileSet.has(c.id);
        const attaches = attachmentMap[c.id] || [];
        const hasAttach = attaches.length > 0;
        const hasAnyDownload = hasFlow || hasAttach;
        const actsDisplay = (c.actions || '').split(',').map(s => s.trim()).filter(Boolean).join(' / ');
        return `
        <div class="case-card">
          ${canDelete ? `<button class="delete-btn" data-del="${c.id}">削除</button>` : ''}
          <div class="badges">
            <span class="cat">${escapeHtml(c.category)}</span>
          </div>
          <h4>${escapeHtml(c.title)}</h4>
          <div class="summary">${escapeHtml(c.summary)}</div>
          ${actsDisplay ? `<div class="actions">🔧 ${escapeHtml(actsDisplay)}</div>` : ''}
          ${hasAttach ? `<div class="attaches">📎 ${attaches.map(a => escapeHtml(a.file_name)).join('、 ')}</div>` : ''}
          <div class="footer">
            <div class="footer-left">
              <span class="saved">⏱️ 月${c.saved_hours}時間</span>
              ${hasAnyDownload ? `<button class="download-btn" data-dl="${c.id}" data-title="${escapeHtml(c.title)}">📦 ファイル一式をダウンロード</button>` : ''}
            </div>
            <button class="like-btn ${liked ? 'liked' : ''}" data-like="${c.id}">${liked ? '❤️' : '🤍'} ${likeCount}</button>
          </div>
          <div class="author">👤 ${escapeHtml(author)} ・ ${formatRelativeTime(c.created_at)}</div>
        </div>
      `;
      }).join('') + '</div>'
      + (filtered.length > visibleCount
          ? `<div class="load-more-wrap"><button type="button" class="load-more-btn" id="loadMoreBtn">もっと見る（残り ${filtered.length - visibleCount} 件）</button></div>`
          : '');

      document.querySelectorAll('[data-like]').forEach(btn => {
        btn.onclick = () => toggleLike(parseInt(btn.dataset.like, 10));
      });
      document.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = () => deleteCase(parseInt(btn.dataset.del, 10));
      });
      document.querySelectorAll('[data-dl]').forEach(btn => {
        btn.onclick = () => downloadFlowZip(parseInt(btn.dataset.dl, 10), btn.dataset.title, btn);
      });
      const moreBtn = document.getElementById('loadMoreBtn');
      if (moreBtn) moreBtn.onclick = () => { visibleCount += PAGE_SIZE; render(); };
    }

    // -------- いいね --------
    async function toggleLike(caseId) {
      if (likedSet.has(caseId)) {
        const { error } = await window.supabaseClient
          .from('case_likes').delete().match({ case_study_id: caseId, user_id: currentUser.id });
        if (error) { alert('いいね解除に失敗：' + error.message); return; }
        likedSet.delete(caseId);
        likeMap[caseId] = Math.max(0, (likeMap[caseId] || 1) - 1);
      } else {
        const { error } = await window.supabaseClient
          .from('case_likes').insert({ case_study_id: caseId, user_id: currentUser.id });
        if (error) { alert('いいねに失敗：' + error.message); return; }
        likedSet.add(caseId);
        likeMap[caseId] = (likeMap[caseId] || 0) + 1;
      }
      render();
    }

    // -------- 削除（ON DELETE CASCADE で flow_files も連動削除） --------
    async function deleteCase(caseId) {
      if (!confirm('この事例を削除しますか？（フローテキスト・添付ファイルも一緒に削除されます）')) return;
      const { error } = await window.supabaseClient.from('case_studies').delete().eq('id', caseId);
      if (error) { alert('削除に失敗：' + error.message); return; }
      cases = cases.filter(c => c.id !== caseId);
      delete likeMap[caseId];
      likedSet.delete(caseId);
      flowFileSet.delete(caseId);
      delete attachmentMap[caseId];
      render();
    }

    // -------- ZIPダウンロード（フロー＋添付ファイル） --------
    async function downloadFlowZip(caseId, title, btn) {
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = '処理中...';
      try {
        const zip = new JSZip();
        let added = 0;

        // 1. フローテキスト（flows/ フォルダ）
        const { data: flows, error: flowErr } = await window.supabaseClient
          .from('case_flow_files')
          .select('file_name, flow_text')
          .eq('case_study_id', caseId);
        if (flowErr) console.warn('フロー取得失敗', flowErr);
        if (flows && flows.length > 0) {
          const folder = zip.folder('flows');
          flows.forEach(f => {
            folder.file(sanitizeFileName(f.file_name) + '.txt', f.flow_text);
            added++;
          });
        }

        // 2. 添付ファイル（attachments/ フォルダ）
        const attaches = attachmentMap[caseId] || [];
        if (attaches.length > 0) {
          const folder = zip.folder('attachments');
          for (const a of attaches) {
            const { data: blob, error: dlErr } = await window.supabaseClient
              .storage.from('case-attachments').download(a.storage_path);
            if (dlErr) {
              console.warn('添付ダウンロード失敗', a.file_name, dlErr);
              continue;
            }
            folder.file(a.file_name, blob);
            added++;
          }
        }

        if (added === 0) { alert('ダウンロード可能なファイルがありません'); return; }

        const blob = await zip.generateAsync({ type: 'blob' });
        const safeTitle = sanitizeFileName(title) || 'untitled';
        const fname = `PADフロー_${safeTitle}_${todayYmd()}.zip`;

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    (async () => {
      currentUser = await window.auth.requireAuth();
      if (!currentUser) return;
      isAdminFlag = await window.auth.isAdmin();

      const profile = await window.auth.getCurrentProfile();
      document.getElementById('topbarUser').textContent = profile?.display_name || currentUser.email;
      if (profile?.display_name) profileMap[currentUser.id] = profile.display_name;
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('case-study');

      // フィルターのアクションチェックボックス：見た目の連動
      bindActionCheckHighlight(document.getElementById('fFilterActions'));

      const applyFilter = () => { visibleCount = PAGE_SIZE; render(); };
      ['fSearch','fFilterCat','fSort'].forEach(id => document.getElementById(id).addEventListener('input', applyFilter));
      document.querySelectorAll('#fFilterActions input[type=checkbox]').forEach(cb => cb.addEventListener('change', applyFilter));

      await loadAll();
    })();
  </script>
</body>
