<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | Fellows PAD道場</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/corporate.css?v=13">
  <script src="js/theme.js?v=3"></script>
  <style>
    .signup-hint {
      background: rgba(44,123,229,0.08);
      border: 1px dashed #2c7be5;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    .signup-hint strong { color: #2c7be5; }
    .error-msg {
      color: #e63757;
      font-size: 14px;
      margin-top: 4px;
      display: none;
    }
    .success-msg {
      color: #00875a;
      font-size: 13px;
      text-align: center;
      margin: 12px 0;
      display: none;
    }
    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }
    .login-link a {
      color: #2c7be5;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }
    .help-text {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">&#128100;</div>
        <h1>新規登録</h1>
        <div class="subtitle">Fellows PAD道場のアカウントを作成</div>
      </div>

      <div class="signup-hint">
        <strong>&#128221; 入力項目について</strong><br>
        メール・パスワード・表示名はすべて必須です。
      </div>

      <form id="signupForm" onsubmit="return doSignup(event)">
        <div class="form-group">
          <label for="email">メールアドレス <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="例: yamada@example.com" autocomplete="email">
          <div class="error-msg" id="email-error">有効なメールアドレスを入力してください</div>
        </div>

        <div class="form-group">
          <label for="password">パスワード <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="8文字以上の半角英数" autocomplete="new-password">
          <div class="help-text">8文字以上、半角英数を含めてください</div>
          <div class="error-msg" id="password-error">パスワードは8文字以上で入力してください</div>
        </div>

        <div class="form-group">
          <label for="displayName">表示名 <span class="required">*</span></label>
          <input type="text" id="displayName" class="form-control" placeholder="例: 山田 太郎" autocomplete="name">
          <div class="error-msg" id="displayName-error">表示名を入力してください</div>
        </div>

        <div class="form-group">
          <label for="location">拠点 <span class="required">*</span></label>
          <select id="location" class="form-control">
            <option value="">選択してください</option>
            <option value="本社">本社</option>
            <option value="札幌">札幌</option>
            <option value="仙台">仙台</option>
            <option value="名古屋">名古屋</option>
            <option value="大阪">大阪</option>
            <option value="福岡">福岡</option>
          </select>
          <div class="error-msg" id="location-error">拠点を選択してください</div>
        </div>

        <div class="error-msg" id="auth-error" style="font-size:13px; text-align:center; margin-bottom:12px;">
          登録に失敗しました
        </div>

        <div class="success-msg" id="success-msg">
          登録が完了しました。自動的にログインします...
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="signupBtn">
          アカウント作成
        </button>
      </form>

      <div class="login-link">
        すでにアカウントをお持ちの方は <a href="index.html">ログインはこちら</a>
      </div>

      <div style="margin-top: 20px; font-size: 14px; color: #aaa; text-align: center;">
        &copy; 2025 Fellows PAD道場
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // すでにログイン済みなら即リダイレクト
    (async () => {
      const user = await window.auth.getCurrentUser();
      if (user) window.location.href = 'pad-overview.html';
    })();

    // Supabase の英語エラーを受講者向けのやさしい日本語に変換する
    function friendlySignupError(raw) {
      const m = (raw || '').toLowerCase();
      if (m.includes('rate limit') || m.includes('too many')) {
        return 'ただ今メール送信が混み合っています。しばらく時間をおいて、もう一度お試しください。';
      }
      if (m.includes('already registered') || m.includes('already been registered') || m.includes('user already')) {
        return 'このメールアドレスはすでに登録されています。ログイン画面からお進みください。';
      }
      if (m.includes('invalid') && m.includes('email')) {
        return 'メールアドレスの形式が正しくないようです。ご確認ください。';
      }
      if (m.includes('password')) {
        return 'パスワードは8文字以上で、半角英数を含めて入力してください。';
      }
      // 未知のエラーは原文も添えて表示（サポート時の切り分け用）
      return '登録に失敗しました。時間をおいて再度お試しください。（詳細: ' + raw + '）';
    }

    async function doSignup(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value.trim();
      const location = document.getElementById('location').value;

      document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
      document.getElementById('success-msg').style.display = 'none';

      let hasError = false;
      if (!email || !email.includes('@')) {
        document.getElementById('email-error').style.display = 'block'; hasError = true;
      }
      if (!password || password.length < 8) {
        document.getElementById('password-error').style.display = 'block'; hasError = true;
      }
      if (!displayName) {
        document.getElementById('displayName-error').style.display = 'block'; hasError = true;
      }
      if (!location) {
        document.getElementById('location-error').style.display = 'block'; hasError = true;
      }
      if (hasError) return false;

      const btn = document.getElementById('signupBtn');
      btn.innerHTML = '<span class="loading"></span> 登録中...';
      btn.disabled = true;

      const { data, error } = await window.auth.signUp(email, password, displayName, location);

      if (error) {
        const msg = document.getElementById('auth-error');
        msg.textContent = friendlySignupError(error.message);
        msg.style.display = 'block';
        btn.innerHTML = 'アカウント作成';
        btn.disabled = false;
        return false;
      }

      // 新規アカウントは「管理者の承認待ち」状態。
      // メール確認OFFで自動ログインのセッションが返っても、承認前はアプリに入れないので
      // ここでサインアウトして承認待ちであることを伝える。
      if (data.session) {
        await window.supabaseClient.auth.signOut();
      }
      document.getElementById('success-msg').innerHTML =
        '登録を受け付けました。<br>管理者が承認するとログインできるようになります。承認までしばらくお待ちください。';
      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('signupForm').querySelectorAll('input').forEach(el => el.disabled = true);
      btn.innerHTML = '承認待ち';
      btn.disabled = true;
      return false;
    }
  </script>
</body>
</html>
